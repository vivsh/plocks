name: Checks
on: [push, pull_request, workflow_dispatch]
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,web]'
      - run: python -m pytest -q
      - run: python -m mypy src tests examples
      - run: pyright
      - run: python -m ruff check src tests examples
      - run: python -m ruff format --check src tests examples
  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,web]' 'pygame-ce==2.5.7' 'Pillow==11.3.0'
      - run: python -m pytest -q
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
      - run: python -m build
      - run: python -m pip uninstall -y plocks
      - run: python -m pip install dist/plocks-0.2.1-py3-none-any.whl
      - run: cd /tmp && pyright --verifytypes plocks --ignoreexternal
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
